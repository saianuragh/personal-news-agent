<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>$title</title>
    <style>
      body { margin:0; padding:0; background:#d9d3c2; }
      a { text-decoration:none; }
      @media only screen and (max-width:520px) {
        .content { padding:4px 16px 22px !important; }
        .brand { font-size:36px !important; letter-spacing:1px !important; }
        .story.lead h3 { font-size:28px !important; }
        .col { display:block !important; width:100% !important; padding:0 !important; border-left:0 !important; }
        .col-right { padding-top:6px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#d9d3c2;color:#1a1a1a;font-family:Georgia,'Times New Roman',Times,serif;">
    <table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#d9d3c2;">
      <tbody><tr><td align="center" style="padding:14px 8px;">
        <table role="presentation" class="container" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:620px;background:#f7f3e8;">
          <tbody><tr><td class="content" style="padding:10px 30px 28px;">
            <div class="masthead" style="margin-top:12px;padding:16px 0 12px;border-top:4px double #1a1a1a;text-align:center;">
              <p class="brand" style="margin:0;color:#1a1a1a;font-family:Georgia,'Times New Roman',Times,serif;font-size:56px;font-weight:bold;line-height:1.02;letter-spacing:3px;">PERSONAL NEWS</p>
            </div>
            <p class="edition" style="margin:0;padding:7px 0;border-top:1px solid #1a1a1a;border-bottom:4px double #1a1a1a;color:#4a443a;font-family:Georgia,'Times New Roman',Times,serif;font-size:11px;letter-spacing:2.5px;text-align:center;text-transform:uppercase;">Daily Brief · $local_date</p>
            $empty_notice
            <h1 class="section-heading" style="margin:26px 0 0;padding:0 0 8px;border-bottom:1px solid #1a1a1a;color:#1a1a1a;font-family:Georgia,'Times New Roman',Times,serif;font-size:12px;font-weight:bold;letter-spacing:4px;text-align:center;">TOP 5</h1>
            $top_stories
            $categories
            $addons
            <div class="footer" style="margin-top:34px;padding-top:12px;border-top:4px double #1a1a1a;color:#6e675b;font-family:Georgia,'Times New Roman',Times,serif;font-size:11px;font-style:italic;line-height:1.5;text-align:center;">
              Follow the links for complete reporting from the original sources.
            </div>
          </td></tr></tbody>
        </table>
      </td></tr></tbody>
    </table>
  </body>
</html>
