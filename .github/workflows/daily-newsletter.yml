name: Daily Newsletter

on:
  # Started at 07:00 IST by an external timer. GitHub's own schedule ran hours late.
  # Manual dispatch with optional send toggle. Default false means config-check only.
  workflow_dispatch:
    inputs:
      send:
        description: "Send the newsletter (false = config-check only, true = send)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-newsletter-production
  cancel-in-progress: false

jobs:
  send-newsletter:
    # Do not expose production secrets to code dispatched from a feature branch.
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_CONFIG_DIR: config
      NEWSLETTER_TIMEZONE: Asia/Kolkata
      NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
      EMAIL_PROVIDER: smtp
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: openrouter/free
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_TIMEOUT_SECONDS: "20"
      LLM_MAX_ATTEMPTS: "2"
      LLM_REQUEST_INTERVAL_SECONDS: "3.2"
      LLM_RETRY_MAX_WAIT_SECONDS: "8"
      EMAIL_TIMEOUT_SECONDS: "20"
      EMAIL_MAX_ATTEMPTS: "2"
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the application
        run: python -m pip install .

      - name: Validate non-interactive send configuration
        run: personal-news-agent config-check

      - name: Decide whether to send
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.send }}" == "true" ]]; then
              echo "send=true" >> "$GITHUB_OUTPUT"
            else
              echo "send=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the production newsletter pipeline
        id: send
        if: steps.decide.outputs.send == 'true'
        run: |
          rc=0
          personal-news-agent send > "$RUNNER_TEMP/send.json" || rc=$?
          cat "$RUNNER_TEMP/send.json"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Print safe summary
        if: always() && steps.decide.outputs.send == 'true'
        run: |
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "send.json")
          try:
              data = json.loads(open(path).read().strip().splitlines()[-1])
              status = data.get("status", "unknown")
              ok = bool((data.get("delivery") or {}).get("success"))
          except Exception:
              status, ok = "unreadable", False
          print(f"Status: {status}. SMTP accepted = {'yes' if ok else 'no'}. Inbox delivery = not verified.")
          PY
