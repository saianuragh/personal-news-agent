# Reliable free RSS feeds grouped around the newspaper's editorial sections.
# Feeds are independently fault-tolerant; one outage does not block other sections.
sources:
  - source_id: bbc_world
    enabled: true
    name: BBC News
    kind: rss_atom
    endpoint: https://feeds.bbci.co.uk/news/world/rss.xml
    categories: [World]
    quality_weight: 1.0
    timeout_seconds: 10
    request_interval_seconds: 1
    language: en
  - source_id: guardian_world
    enabled: true
    name: The Guardian
    kind: rss_atom
    endpoint: https://www.theguardian.com/world/rss
